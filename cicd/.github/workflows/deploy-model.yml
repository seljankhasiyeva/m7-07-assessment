name: Deploy Model

on:
  workflow_dispatch:
    inputs:
      model_version:
        description: "Model version to deploy (e.g. v1.3.0)"
        required: true
      environment:
        description: "Target environment"
        required: true
        default: staging
        type: choice
        options: [staging, production]

env:
  REGISTRY: ghcr.io/example/recommendations
  MODEL_STORE: s3://ml-artifacts/recommendations

jobs:
  validate:
    name: Validate model version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check model exists in registry
        run: |
          python scripts/check_registry.py \
            --model-version "${{ inputs.model_version }}" \
            --required-stage staging
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}

      - name: Verify offline metrics gate
        run: |
          python scripts/verify_metrics.py \
            --model-version "${{ inputs.model_version }}" \
            --ndcg-min 0.42 \
            --coverage-min 0.85

  build:
    name: Build and scan image
    runs-on: ubuntu-latest
    needs: validate
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate image tag
        id: tag
        run: echo "tag=${{ env.REGISTRY }}:${{ inputs.model_version }}-${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build image
        run: |
          docker build \
            --tag "${{ steps.tag.outputs.tag }}" \
            --label "model_version=${{ inputs.model_version }}" \
            --label "git_commit=${{ github.sha }}" \
            .

      - name: Trivy security scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.tag.outputs.tag }}
          exit-code: "1"
          severity: CRITICAL

      - name: Push image
        run: docker push "${{ steps.tag.outputs.tag }}"

  deploy-staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    needs: build
    if: inputs.environment == 'staging' || inputs.environment == 'production'
    environment: staging
    steps:
      - name: Deploy to staging
        run: |
          kubectl set env deployment/recommendations \
            MODEL_VERSION="${{ inputs.model_version }}" \
            -n staging
          kubectl rollout status deployment/recommendations -n staging --timeout=5m

      - name: Run load tests
        run: |
          k6 run \
            -e API_KEY=${{ secrets.STAGING_API_KEY }} \
            -e MODEL_VERSION=${{ inputs.model_version }} \
            serving/load-test-script.js
        timeout-minutes: 35

      - name: Promote model to staging in registry
        run: |
          python scripts/promote_model.py \
            --model-version "${{ inputs.model_version }}" \
            --to-stage staging

  deploy-production:
    name: Deploy to production (canary)
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: inputs.environment == 'production'
    environment: production
    steps:
      - name: Canary deploy 5%
        run: |
          # k8s/canary-patch.yaml defines the canary deployment — see k8s/ directory
          kubectl apply -f k8s/canary-patch.yaml \
            --dry-run=server
          kubectl patch deployment recommendations-canary \
            -p '{"spec":{"template":{"spec":{"containers":[{"name":"recommendations","env":[{"name":"MODEL_VERSION","value":"${{ inputs.model_version }}"}]}]}}}}' \
            -n production
          kubectl scale deployment recommendations-canary --replicas=1 -n production

      - name: Wait and check canary metrics
        run: |
          sleep 300
          python scripts/check_canary.py \
            --model-version "${{ inputs.model_version }}" \
            --max-error-rate 0.01 \
            --max-p95-ms 150

      - name: Full rollout
        run: |
          kubectl set env deployment/recommendations \
            MODEL_VERSION="${{ inputs.model_version }}" \
            -n production
          kubectl rollout status deployment/recommendations -n production --timeout=10m

      - name: Promote model to production in registry
        run: |
          python scripts/promote_model.py \
            --model-version "${{ inputs.model_version }}" \
            --to-stage production \
            --approver "${{ github.actor }}"

      - name: Tag image as production
        run: |
          docker tag "${{ needs.build.outputs.image_tag }}" \
            "${{ env.REGISTRY }}:production-latest"
          docker push "${{ env.REGISTRY }}:production-latest"